version: '3.9'

services:
  # ── Eclipse Mosquitto MQTT Broker (TCP 1883 & WebSockets 9001) ───────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: evsarthi_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # ── Hyundai SmartReserve FastAPI Backend & Unified Web Service ───────────────
  smartreserve:
    build: .
    container_name: hyundai_smartreserve_backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - RAZORPAY_KEY_ID=rzp_test_placeholder
      - RAZORPAY_KEY_SECRET=placeholder
      - OCM_API_KEY=1f545914-8daa-4fa6-9d7b-4a6819f2f7cc
      # Pass Gemini API key if present in host environment
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./smartreserve/smartreserve_backend:/app/smartreserve_backend
      - ./smartreserve/smartreserve_frontend:/app/smartreserve_frontend

volumes:
  mosquitto_data:
  mosquitto_log:
