# Eclipse Mosquitto Configuration for EV Sarthi & Hyundai SmartReserve
# Dual Listeners: Port 1883 (TCP for ESP32 and Backend), Port 9001 (WebSockets for Wokwi & Browsers)

per_listener_settings false
allow_anonymous true

# Standard MQTT TCP Listener (Hardware simulation & Backend)
listener 1883 0.0.0.0
protocol mqtt

# WebSockets Listener (Browser Dashboards & Wokwi Simulation)
listener 9001 0.0.0.0
protocol websockets

# Persistence Configuration
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
autosave_on_changes false

# Logging Configuration
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection & Buffer Limits
max_connections -1
max_queued_messages 1000
max_inflight_messages 20
